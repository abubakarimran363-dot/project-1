<!DOCTYPE html>
<html lang="en">
    
<style>

/* Footer background like the image */
footer{
    background: #2b2b2b;     /* dark grey */
    width: 100%;
}

/* Center text + spacing */
footer .container{
    padding: 22px 0 !important;
}

/* Text styling */
footer h5{
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    color: #8b8b8b;         /* muted grey */
}

/* Highlighted link text */
footer a{
    color: #f2a900 !important; /* yellow */
    text-decoration: none;
}

footer a:hover{
    text-decoration: underline;
}

/* Social Media Section Styling (agar mazeed zaroorat paray toh yahan add kar sakte ho) */
#social-media {
    background-color: #1a1a1a;
}

.media_link {
    background-color: #2b2b2b;
    border: 1px solid #3d3d3d;
    transition: 0.3s ease;
}

.media_link:hover {
    background-color: #383838;
}
</style>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <!-- My CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/996973c893.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+TT:ital,wght@0,400;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap" rel="stylesheet">

    <title>Portfolio</title>
</head>

<body>
    <!-- Social Media Section -->
    <div id="social-media" class="container-fluid">
        <div class="container text-white py-5">
            <h4 class="text-warning">Social Media</h4>
            <h1 class="m-heading">Let's be friends</h1>
            <div class="row pt-5">
                <div class="col-3 media_link btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">LinkedIn</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-linkedin-in fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Youtube</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-youtube fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>
                <div class="col-3 media_link bg-warning btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">Email</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fas fa-envelope fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <div class="container text-muted text-center py-3 mt-5">
            <h5>
                Copyright &copy; 2021 |
                <a class="text-warning text-decoration-none" href="#about">All Rights Are Reserved By Codingal Education</a>
            </h5>
        </div>
    </footer>
</body>

</html>
