<h2>join() and pop()</h2>
<P>The join() method joins array element into a string and the pop
method removes the last element from an array.</P>
<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>
<script>
var fruits = ["banana", "orange","apple","mango"];
document.getElementById("myjoine").innerHTML = fruits.join(" * ");
document.getElementByld("myfirstpop").innerHTML = fruits;
fruits.pop();
document.getElementByld("mysecondpop").innerHTML = fruits;
</script>
</P>
