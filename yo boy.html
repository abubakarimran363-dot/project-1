<!DOCTYPE html>
<html>
    <head>
        <title>My Delivery Tracker</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f4ff;
                text-align: center;
                padding: 30px;
            }
            h1 { color:#f0f4ff; }
            button {
                background-color: #ff4d4d;
                color: white;
                border: none;
                padding: 12px 25px;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                margin: 5px;
            }
            div {
                border: 1px solid #ff4d4d;
                width: 280px;
                margin: 10px auto;
                padding: 15px;
                text-align: left;
                border-radius: 6px;
            }            
        </style>
    </head>
    <body>
        <h1>My Delivery Tracker</h1>
        <button onclick="saveOrder()">Save Order</button>
        <button onclick="startDelivery()">start delivery</button>

        <div>JSON Text: <span id="jsonText"></span></div>
        <div>Loaded Item: <span id="loadedItem"></span></div>
        <div>Delivery Status: <span id="deliveryStatus"></span></div>
        <div>Delivery Time: <span id="deliveryTime"></span></div>
        <div>Delivery Location: <span id="deliveryLocation"></span></div>

        <script>

            // JSON - the order stored as a JavaScript object
            let order = {
                item: "Pizza",
                status: "Pending",
                time: "12:30 PM",
                location: "123 Main St"
            };

            // JSON.stringify() and JSON.parse()
            function saveOrder() {
                // Convert the order object to a JSON string
                const jsonString = JSON.stringify(order);
                document.getElementById("jsonText").textContent = jsonString;
            

            document.getElementById("jsonText").textContent = JSON.stringify(order);
            document.getElementById("loadedItem").textContent = order.item;
            document.getElementById("deliveryStatus").textContent = order.status;
            document.getElementById("deliveryTime").textContent = order.time;
            document.getElementById("deliveryLocation").textContent = order.location;
            }

            // delay() - waits ms milliseconds - do not change this
            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
                };
            

            // async and await – track the delivery step by step
async function startDelivery() {
    document.getElementById("deliveryStatus").innerHTML = "";

    // setTimeout with a callback function – runs after 1 second
    document.getElementById("deliveryStatus").innerHTML = "Order received!";
    setTimeout(function() {
        document.getElementById("deliveryStatus").innerHTML = "Kitchen is preparing...";
    }, 1000);

    // await – pause for 3 seconds
    await delay(3000);
    document.getElementById("deliveryStatus").innerHTML = "Out for delivery!";

    // await – pause for 2 seconds
    await delay(2000);
    document.getElementById("deliveryStatus").innerHTML = "Delivered!";

    document.getElementById("deliveryStatus").innerHTML = "Delivery Complete ✅";
}
        </script>
    </body>
</html>
