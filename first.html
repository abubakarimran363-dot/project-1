<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>replit</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <h1>Personal Details Form</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label>Contact Number (This will be hidden)</label><br>
        <input type="password" id="contact"><br><br>
        
        <label>Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label>Favourite City</label><br>
        <input type="checkbox" id="city" value="newyork">New York<br>
        <input type="checkbox" id="city" value="london">London<br>
        <input type="checkbox" id="city" value="tokyo">Tokyo<br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
