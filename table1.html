<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My animal fact file</title>
    <style>

        /* page background - sets the colour and font for the wole page */
        body {
            font-family: Arial;
            background: #f0f0f0;
            padding: 30px;
            text-align: center;
        }

        /* Box Model - wirdth sets the content area pading adds space inside the box and margin adds space outside the box */
        .fact-file {
            width: 300px;
            background: #ffffff;
            padding: 20px;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Animal name - forestgreen so it stand out */
        .animal-name {
            color: forestgreen;
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* Cool fact - orange and italic to make feel secial */
        .cool-fact {
            color: orange;
            font-style: italic;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Habitat: Mountainous regions of Central and South Asia</p>
        <p class="detail">Diet: Carnivore (mainly wild sheep and goats)</p>
        <p class="cool-fact">Cool Fact: Snow leopards can leap up to 50 feet in a single bound!</p>
    </div>
</body>
</html>
