<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobby Card</title>

        <!-- STEP 1 - Bootstrap CSS link-->
         <link rel="stylesheet"

                href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
                integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
                crossorigin="anonymous">

    <style>
        body {
            background-color:aliceblue;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #4a2c2a;
            font-size: 36px;
            text-align: center;
        }
        .hobby-card {
            width: 300px;
            background-color: rgb(145, 229, 255);
            border: 3px solid #ff69b4;
            border-radius: 15px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }
        .hobby-card img {
            width: 100%;
            border-radius: 10px;
            color: #4a2c2a;
        }
    </style>
</head>
<body>
    
    <h1>My Hobby Card</h1>

    <!-- STEP 2 - container keeps the layout keeps the layout neat and centred-->
     <div class="container">

        <!-- STEP 3 - row is a horizontal group of columns-->
        <div class="row justify-content-center">

            <!-- STEP 4 - col-12: full wirdth on phones
                        col-md-6: half wirdth on tablets
                        col-lg-4: one-third on dekstops -->
        <div class="col-12 col-6 col-4">
            <div class="hobby-card">
                <h3>Drawing</h3>
                <p>I love sketching animals</p>
            </div>
        </div>
</body>
</html>
