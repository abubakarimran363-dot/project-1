<!DOCTYPE html>
<html>
<head>
    <title>My Playlist Sorter</title>
    <link rel="stylesheet" href="hhtps://maxcdn.bootstrap.com/4.3.1/css/bootstrap.min.css">
    <style>
        body {background: lavender;}
        h1,h3 { color: darkviolet; }
        .box { background: whight; color: darkviolet }
    </style>
</head>
<body>
    <div class="container py-4"><

    <h1 class="mb-2">My Playlist Soter</div></h1>
    <p class="text-muted mb-4">Sort and label your music playlist using javascript array methods</p>

    <!--TOPIC 1 & 2: sort() and reserve()-->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title"></h3>Song Names</h3>
            <button class="btn-primary mr-2" onclick="sortZA()">Sort A to Z</button>
            <button class="btn-primary" onclick="sortZA()">Sort Z to A</button>
            <div id="nameResul" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>

    <!-- TOPIC 3: sort() with compare function-->
     <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Play Counts</h3>
            <button class="btn btn-primary" onclick="sortleast()">Least First</button>
            <button class="btn btn-primary" onclick="sortMost()">Most Played First</button>
            <div id="countResult" class="box p-3 mt-3 rounded"></div>
        </div>
     </div>

     <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Label Every Play Count</h3>
            <button class="btn btn-primary mr-2" onclick="addlabel()">Add Plays Label</button>
            <div id="labelResult" class="box p-3 mt-3 rounded"></div>
        </div>
    </div>

</div>
<script>
    var songs = ["Zoom", "Bounce", "Glow", "Spark"];  // Topic 1 & 2
    var plays = [320, 85, 210, 50, 175];              // TOPIC 3

    document.getElementById("nameResult").innerHTML = "Song : " + songs;
    document.getElementById("nameResult").innerHTML = "Plays: " + plays;
    document.getElementById("nameResult").innerHTML = "Press the button above!";

    function sortAZ()   { song.sort(); document.getElementById("nameResult").innerHTML = "A to Z" + song; }
    function sortZA()    { songs.sort(); songs.reverse(); document.getElementById("nameResult").innerHTML = "Z to A: " + songs; }
    function sortLeast() { plays.sort(function(a,b){return a-b;}); document.getElementById("countResult").innerHTML = "Least played first: " + plays; }
    function sortMost()  { plays.sort(function(a,b){return b-a;}); document.getElementById("countResult").innerHTML = "Most played first: " + plays; }
    function addLabel()  { var l = plays.map(function(c){return c+" plays";}); document.getElementById("labelResult").innerHTML = "Labelled: " + l; }

</script>
</body>
</html>
