<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my super hero</title>
    <style> body { font-family: 'Courier New', Courier, monospace;} </style>
</head>
<body>
    <h1>My Super Hero</h1>
    <p> Welcome to the world of my super hero!</p>
</body>
</html>
<style>
    
    /* Typography + Text shadow - big bold title an orange shadow  */
    .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: lightblue;
        text-shadow: 5px 4px black;
    }

    /* Typography + text transform - tagline becomes Title case */
    .tagline {
        font-size: italic;
        color: bloody red;
        text-transform: capitalize;
    }

    /* Text Transform + Text decoration - section heading is CAPS with underline */
    .label {
        font-size: 24px;
        color: black;
        text-transform: uppercase;
        text-decoration: underline;
        color: coral;
    }

    /* Typography - powers stand out in bold green */
    .powers {
        font-size: 20px;
        font-weight: bold;
        color: gray;
    }

    /* Text decoration - weaknesses are crossed our */
    .weaknesses {
        font-size: 20px;
        color: red;
        text-decoration: line-through;
    }

    /* Transform - the badge is tited to the side */
    .badge {
        font-size: 30px;
        font-weight: bold;
        transform: rotate(-15deg);
    }

    /* Typography - footer text */
    .made-by {
        font-size: 14px;
        color: black;
    }

</style>
</head>
<body>
    <h1 class="hero-name">thunder kid</h1>
    <p class="tagline">the ultimate coding hero</p>
    <h2 class="label">Powers</h2>
    <ul class="powers">
        <li>Code Generation</li>
        <li>Debugging Mastery</li>
        <li>Language Fluency</li>
    </ul>
    <h2 class="label">Weaknesses</h2>
    <ul class="weaknesses">
        <li>Syntax Errors</li>
        <li>Infinite Loops</li>
        <li>Memory Leaks</li>
    </ul>
    <div class="badge">#1 Coder</div>
    <footer class="made-by">Made by ABUBAKAR IMRAN</footer>

</body>
</html>
